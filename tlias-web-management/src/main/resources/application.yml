# 数据库连接配置
spring:
  application:
    name: tlias-web-management
  datasource:
    url: jdbc:mysql://localhost:3306/tlias
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

# MyBatis 配置
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 开启驼峰命名映射
    map-underscore-to-camel-case: true

# 端口
server:
  port: 8888
